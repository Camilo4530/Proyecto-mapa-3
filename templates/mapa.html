<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>UPS Navigator · Bogotá</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}" />
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='ups.png') }}" alt="UPS Logo" />
    <h1>UPS Navigator · Bogotá</h1>
  </header>
  <!-- CONTENEDOR MAPA + CONTROLES -->
  <div id="mapa">
    <div id="controls">
      <div id="panel">
        <h2>Mis Nodos</h2>
        <button id="modoAgregar">🔵 Señalar nodo</button>
        <ul id="listaNodos"></ul>
      </div>
      <div id="panelRuta">
        <h2>Ruta Óptima</h2>
        <button id="calcularRuta">🧭 Calcular camino</button>
        <ol id="listaRuta"></ol>
      </div>
    </div>

    <div id="map"></div>
  </div>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.polylineDecorator/1.7.0/leaflet.polylineDecorator.min.js"></script>
  <!-- LÓGICA DE MAPA, NODOS Y RUTA -->
  <script>
    // 1) Inicializa el mapa
    const map = L.map('map').setView([4.6097, -74.0817], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    // 2) Estado global
    let modoAgregar = false;
    let nodos = []; 
    const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let polilineas = [];   // aristas azules
    let routeLayers = [];  // línea dorada + flechas
    let stepMarkers = [];  // marcadores numerados
    // 3) Función para limpiar sólo la ruta anterior
    function clearRoute() {
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];
      stepMarkers.forEach(m => map.removeLayer(m));
      stepMarkers = [];
    }
    // 4) Toggle modo "Señalar nodo"
    document.getElementById('modoAgregar').addEventListener('click', () => {
      modoAgregar = !modoAgregar;
      document.getElementById('modoAgregar').classList.toggle('activo');
    });
    // 5) Click en el mapa para añadir nodos
    map.on('click', e => {
  if (!modoAgregar) return;
  const { lat, lng } = e.latlng;
  // calculamos el índice del nodo (1,2,3,...)
  const index = nodos.length + 1;
  // creamos un DivIcon con el número
  const nodeIcon = L.divIcon({
    className: 'node-icon',
    html: `<div>${index}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15]
  });
  // colocamos el marcador numérico
  const marker = L.marker([lat, lng], { icon: nodeIcon })
    .addTo(map)
    .bindPopup(`<b>${index}</b><br>Lat: ${lat.toFixed(4)}<br>Lng: ${lng.toFixed(4)}`)
    .openPopup();
  // guardamos usando "index" en vez de "letra"
  nodos.push({ index, lat, lng, marker });
  actualizarListaNodos();
  dibujarAristas();
});
    // 6) Actualiza el panel de nodos
    function actualizarListaNodos() {
  const lista = document.getElementById('listaNodos');
  lista.innerHTML = '';
  nodos.forEach((nodo, i) => {
    const li = document.createElement('li');
    // Muestra el número secuencial en vez de la letra
    li.textContent = `${nodo.index}: ${nodo.lat.toFixed(4)}, ${nodo.lng.toFixed(4)}`;
    const btn = document.createElement('button');
    btn.textContent = '❌';
    btn.onclick = () => {
      map.removeLayer(nodo.marker);
      nodos.splice(i, 1);
      actualizarListaNodos();
      dibujarAristas();
    };
    li.appendChild(btn);
    lista.appendChild(li);
  });
}
    // 7) Dibuja aristas azules
    function dibujarAristas() {
      polilineas.forEach(p => map.removeLayer(p));
      polilineas = [];
      for (let i = 0; i < nodos.length; i++) {
        for (let j = i + 1; j < nodos.length; j++) {
          const p = L.polyline(
            [[nodos[i].lat, nodos[i].lng], [nodos[j].lat, nodos[j].lng]],
            { color: 'blue' }
          ).addTo(map);
          polilineas.push(p);
        }
      }
    }
    // 8) Al pulsar “Calcular camino”
    document.getElementById('calcularRuta').addEventListener('click', async () => {
      clearRoute();
      const res = await fetch('/camino', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodos: nodos.map(n => ({ lat: n.lat, lng: n.lng })) })
      });
      const data = await res.json();
      mostrarRuta(data.camino || []);
    });
    
    // 9) Dibuja ruta dorada + flechas + marcadores numerados
    function mostrarRuta(camino) {
      const lista = document.getElementById('listaRuta');
      lista.innerHTML = '';

      if (!camino.length) {
        lista.innerHTML = '<li>No hay camino disponible</li>';
        return;
      }
      // Línea dorada
      const color = '#FFB500';
      const linea = L.polyline(
        camino.map(p => [p.lat, p.lng]),
        { color, weight: 6 }
      ).addTo(map);
      // Flechas cada 10%
      const decorator = L.polylineDecorator(linea, {
        patterns: [{
          offset: 0,
          repeat: '10%',
          symbol: L.Symbol.arrowHead({
            pixelSize: 8,
            pathOptions: { fillOpacity:1, stroke:false, color }
          })
        }]
      }).addTo(map);
      // Guarda capa de ruta
      routeLayers = [linea, decorator];
      // Añade marcadores numerados
      camino.forEach((p, i) => {
        let label = i === 0
          ? 'Inicio'
          : i === camino.length - 1
            ? 'Final'
            : String(i);
        const icon = L.divIcon({
          className: 'step-icon',
          html: `<div>${label}</div>`,
          iconSize: [30,30],
          iconAnchor: [15,15]
        });
        const mk = L.marker([p.lat, p.lng], { icon }).addTo(map);
        stepMarkers.push(mk);
        // Lista pasos con dirección
        const next = camino[i+1];
        const b = next ? calcularBearing(p.lat, p.lng, next.lat, next.lng) : null;
        const dirPart = next
          ? ` → ${bearingACardinal(b)} (${b.toFixed(0)}°)`
          : '';
        const li = document.createElement('li');
        li.textContent = `Paso ${i+1}${dirPart}: Lat ${p.lat.toFixed(4)}, Lng ${p.lng.toFixed(4)}`;
        lista.appendChild(li);
      });
    }
  </script>
</body>
</html>
